<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and borders -->
  <rect x="100" y="50" width="750" height="500" fill="#f0f0ff" stroke="#333" stroke-width="2" rx="10" />
  <text x="120" y="80" font-family="Arial" font-size="18" font-weight="bold">Google Cloud Platform</text>
  
  <rect x="150" y="150" width="650" height="300" fill="#e6f7ff" stroke="#333" stroke-width="2" rx="8" />
  <text x="170" y="180" font-family="Arial" font-size="16" font-weight="bold">Google Kubernetes Engine (GKE)</text>
  
  <!-- User -->
  <circle cx="50" cy="250" r="30" fill="#ffd6cc" stroke="#333" stroke-width="2" />
  <text x="50" y="255" font-family="Arial" font-size="14" text-anchor="middle">User</text>
  
  <!-- Cloud Load Balancer -->
  <polygon points="200,250 240,210 280,250 240,290" fill="#ffccf9" stroke="#333" stroke-width="2" />
  <text x="240" y="255" font-family="Arial" font-size="12" text-anchor="middle">Cloud Load</text>
  <text x="240" y="270" font-family="Arial" font-size="12" text-anchor="middle">Balancer</text>
  <text x="240" y="285" font-family="Arial" font-size="10" text-anchor="middle">(GKE Ingress)</text>
  
  <!-- API Service -->
  <rect x="380" y="220" width="120" height="60" rx="10" fill="#b3d1ff" stroke="#333" stroke-width="2" />
  <text x="440" y="250" font-family="Arial" font-size="12" text-anchor="middle">Task Management</text>
  <text x="440" y="265" font-family="Arial" font-size="12" text-anchor="middle">API Service</text>
  <text x="440" y="280" font-family="Arial" font-size="10" text-anchor="middle">(HTTPS)</text>
  
  <!-- Kubernetes Pod -->
  <rect x="380" y="350" width="120" height="60" rx="10" fill="#b3d1ff" stroke="#333" stroke-width="2" />
  <text x="440" y="385" font-family="Arial" font-size="14" text-anchor="middle">Kubernetes Pod</text>
  <text x="440" y="400" font-family="Arial" font-size="12" text-anchor="middle">(API)</text>
  
  <!-- Cloud SQL -->
  <rect x="600" y="150" width="120" height="60" rx="5" fill="#b3ffb3" stroke="#333" stroke-width="2" />
  <text x="660" y="185" font-family="Arial" font-size="14" text-anchor="middle">Cloud SQL</text>
  <text x="660" y="200" font-family="Arial" font-size="12" text-anchor="middle">(MySQL)</text>
  
  <!-- Cloud Memorystore -->
  <rect x="600" y="350" width="120" height="60" rx="5" fill="#e6ccff" stroke="#333" stroke-width="2" />
  <text x="660" y="380" font-family="Arial" font-size="14" text-anchor="middle">Cloud Memorystore</text>
  <text x="660" y="395" font-family="Arial" font-size="12" text-anchor="middle">(Redis)</text>
  
  <!-- kubectl -->
  <rect x="200" y="470" width="80" height="40" rx="5" fill="#ffffb3" stroke="#333" stroke-width="2" />
  <text x="240" y="495" font-family="Arial" font-size="14" text-anchor="middle">kubectl</text>
  
  <!-- GKE Cluster -->
  <rect x="380" y="470" width="120" height="40" rx="5" fill="#ffda99" stroke="#333" stroke-width="2" />
  <text x="440" y="495" font-family="Arial" font-size="14" text-anchor="middle">GKE Cluster</text>
  
  <!-- Connections -->
  <!-- User to Load Balancer -->
  <line x1="80" y1="250" x2="200" y2="250" stroke="#333" stroke-width="2" />
  <polygon points="195,245 200,250 195,255" fill="#333" />
  
  <!-- Load Balancer to API Service -->
  <line x1="280" y1="235" x2="380" y2="235" stroke="#333" stroke-width="2" />
  <polygon points="375,230 380,235 375,240" fill="#333" />
  <text x="330" y="225" font-family="Arial" font-size="10">HTTPS (443)</text>
  
  <line x1="280" y1="265" x2="380" y2="265" stroke="#333" stroke-width="2" />
  <polygon points="375,260 380,265 375,270" fill="#333" />
  <text x="330" y="285" font-family="Arial" font-size="10">HTTP (80)</text>
  
  <!-- API Service to Cloud SQL -->
  <line x1="500" y1="235" x2="600" y2="180" stroke="#333" stroke-width="2" />
  <polygon points="595,182 600,180 598,185" fill="#333" />
  <text x="530" y="190" font-family="Arial" font-size="10">Cloud SQL Proxy (3306)</text>
  
  <!-- API Service to Memorystore -->
  <line x1="500" y1="265" x2="600" y2="365" stroke="#333" stroke-width="2" />
  <polygon points="595,362 600,365 595,368" fill="#333" />
  <text x="530" y="320" font-family="Arial" font-size="10">Redis Client (6379)</text>
  
  <!-- Pod to Cloud SQL -->
  <line x1="500" y1="360" x2="600" y2="195" stroke="#333" stroke-width="2" />
  <polygon points="595,197 600,195 598,200" fill="#333" />
  <text x="530" y="265" font-family="Arial" font-size="10">Cloud SQL Proxy</text>
  
  <!-- Pod to Memorystore -->
  <line x1="500" y1="380" x2="600" y2="380" stroke="#333" stroke-width="2" />
  <polygon points="595,375 600,380 595,385" fill="#333" />
  <text x="550" y="370" font-family="Arial" font-size="10">Redis Client</text>
  
  <!-- kubectl to GKE Cluster -->
  <line x1="280" y1="490" x2="380" y2="490" stroke="#333" stroke-width="2" />
  <polygon points="375,485 380,490 375,495" fill="#333" />
  <text x="330" y="480" font-family="Arial" font-size="10">Manage</text>
  
  <!-- GKE Cluster to Pod -->
  <line x1="440" y1="470" x2="440" y2="410" stroke="#333" stroke-width="2" />
  <polygon points="435,415 440,410 445,415" fill="#333" />
  <text x="450" y="440" font-family="Arial" font-size="10">Runs</text>
</svg>